name = "onibus-rj-ao-vivo"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
account_id = "864c4fd22125f77c95e383c82331b7a4"

[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[routes]]
pattern = "kbrianps.com/tools/onibus-rj-ao-vivo"
zone_id = "0c431faf60029ddeb333942fbffcc58b"

[[routes]]
pattern = "kbrianps.com/tools/onibus-rj-ao-vivo/*"
zone_id = "0c431faf60029ddeb333942fbffcc58b"

[[routes]]
pattern = "www.kbrianps.com/tools/onibus-rj-ao-vivo"
zone_id = "0c431faf60029ddeb333942fbffcc58b"

[[routes]]
pattern = "www.kbrianps.com/tools/onibus-rj-ao-vivo/*"
zone_id = "0c431faf60029ddeb333942fbffcc58b"

[[routes]]
pattern = "kbrianps.com/.well-known/assetlinks.json"
zone_id = "0c431faf60029ddeb333942fbffcc58b"

[[routes]]
pattern = "www.kbrianps.com/.well-known/assetlinks.json"
zone_id = "0c431faf60029ddeb333942fbffcc58b"

[[routes]]
pattern = "kbrianps.com/onibus-rj-ao-vivo"
zone_id = "0c431faf60029ddeb333942fbffcc58b"

[[routes]]
pattern = "www.kbrianps.com/onibus-rj-ao-vivo"
zone_id = "0c431faf60029ddeb333942fbffcc58b"


[vars]
# Canonical URL of the deployed app (used for 301 redirects to canonical path).
CANONICAL_BASE = "https://kbrianps.com"
# Subpath where the app is mounted under CANONICAL_BASE. Must match Vite PUBLIC_BASE (without trailing slash).
APP_PATH = "/tools/onibus-rj-ao-vivo"
# Comma-separated list of origins allowed to call /api/* endpoints.
ALLOWED_ORIGINS = "https://kbrianps.com,https://www.kbrianps.com"
# Android Trusted Web Activity (TWA) package id and signing fingerprints (CSV of SHA-256 hex with colons).
TWA_PACKAGE_NAME = "com.kbrianps.onibusrjaovivo"
TWA_FINGERPRINTS = "3D:55:0E:DA:0B:16:3C:0F:1F:74:0D:AE:3E:3E:25:91:F6:D3:C5:1C:07:50:93:9D:2D:79:5C:A3:E0:98:61:19"

[triggers]
crons = ["* * * * *"]

[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 45, period = 60 }

[[r2_buckets]]
binding = "ROUTES"
bucket_name = "onibus-rj-routes"

[dev]
port = 8787

[env.dev.vars]
ALLOWED_ORIGINS = "https://kbrianps.com,https://www.kbrianps.com,http://localhost:5173,http://127.0.0.1:5173"
